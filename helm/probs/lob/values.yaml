# Default values for lob-app
# This is a YAML-formatted file.

# Namespace configuration
namespace:
  create: true
  name: default
  labels:
    name: default

# Secret name
secretName: docker-registry-secret

# Additional labels to add to the secret
labels: {}

# Additional annotations to add to the secret
annotations: {}

# Docker registry credentials
# IMPORTANT: For production, use --set flags or external secrets management
# Do not commit actual credentials to version control!
containerRegistry:
  # Registry server URL (e.g., https://index.docker.io/v1/, ghcr.io, <account>.dkr.ecr.<region>.amazonaws.com)
  registry: ""
  # Registry username
  username: ""
  # Registry password or API key
  password: ""
  # Email associated with the registry account
  email: ""

# Number of replicas
replicaCount: 1

# Image configuration
image:
  repository: localhost
  name: lob-app
  tag: "latest"
  pullPolicy: IfNotPresent
  
# Service account configuration
serviceAccount:
  create: false
  name: ""

# Pod labels
podLabels: {}

# Environment variables
env:
  OTEL_METRICS_EXPORTER: "prometheus"

podAnnotations:
  # Pod annotations for Prometheus scraping with OpenTelemetry instrumentation
  prometheus.io/scrape: "true"
  prometheus.io/path: "/metrics"
  prometheus.io/port: "8000"
  prometheus.io/scheme: "http"
  # Dynatrace ActiveGate annotations (optional, only if using Dynatrace OneAgent for monitoring)
  # metadata.dynatrace.com/k8s.namespace.label.domain: sandbox
  # metadata.dynatrace.com/dt.security_context: sg_sandbox
  # Do not enable both Prometheus and Dynatrace scraping at the same time unless you have a specific use case for it.
  metrics.dynatrace.com/scrape: "false"
  metrics.dynatrace.com/path: "/metrics"
  metrics.dynatrace.com/port: "8000"

# Container configuration
container:
  args: []
  name: lob-app
  httpPort: 8080
  metricsPort: 8000
  httpPortName: http
  metricsPortName: metrics

# Additional environment variables from secrets or configmaps
envFrom: []

# Resource limits and requests
resources:
  limits:
    cpu: "200m"
    memory: "256Mi"
  requests:
    cpu: "100m"
    memory: "128Mi"

# Service configuration
service:
  type: ClusterIP
  httpPort: 8080
  targetHttpPort: 8080
  metricsPort: 8000
  targetMetricsPort: 8000

# Node selector
nodeSelector: {}

# Tolerations
tolerations: []

# Affinity rules
affinity: {}

# Security context for the pod
podSecurityContext: {}

# Security context for the container
securityContext: {}

# Liveness probe configuration
livenessProbe:
  enabled: false
  httpGet:
    path: /health
    port: http
  initialDelaySeconds: 30
  periodSeconds: 10

# Readiness probe configuration
readinessProbe:
  enabled: false
  httpGet:
    path: /health
    port: http
  initialDelaySeconds: 5
  periodSeconds: 10
