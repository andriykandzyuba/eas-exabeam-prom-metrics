# Default values for Dynatrace DynaKube OneAgent

# Namespace for the DynaKube resources
namespace:
  create: true
  name: dynatrace

# Dynatrace API URL including the `/api` path at the end
# For SaaS, set ENVIRONMENTID to your environment ID
# Example: https://ENVIRONMENTID.live.dynatrace.com/api
apiUrl: ""

# Secret configuration for Dynatrace tokens
secret:
  create: true
  name: dynakube
  # IMPORTANT: For production, use --set or external secrets management
  apiToken: ""
  dataIngestToken: ""

# DynaKube custom resource name
dynakubeName: agent

# DynaKube custom resource name for Kubernetes Monitoring only
dynakubeK8sMonitoringName: k8s-monitoring

# Optional: Disable certificate validation checks for installer download and API communication
skipCertCheck: false

# Configuration for Metadata Enrichment
metadataEnrichment:
  enabled: true

# Configuration for OneAgent instances
oneAgent:
  hostGroup: integration-probs
  cloudNativeFullStack:
    tolerations:
      - effect: NoSchedule
        key: node-role.kubernetes.io/master
        operator: Exists
      - effect: NoSchedule
        key: node-role.kubernetes.io/control-plane
        operator: Exists
      - effect: NoSchedule
        key: kubernetes.azure.com/role
        operator: Equal
        value: agent
    resources:
      requests:
        cpu: 100m   # Reduce from higher defaults (e.g., 200m or 500m)
        memory: 200Mi
      limits:
        cpu: 500m       # Consider removing this entirely to prevent throttling
        memory: 512Mi

# Configuration for ActiveGate for Kubernetes Monitoring only
activeGateK8sMonitoring:

  metadata:
    name: k8s-monitoring
  # Specifies which capabilities will be enabled on ActiveGate instances
  capabilities:
    - kubernetes-monitoring

  # Resource settings for ActiveGate instances
  resources:
    requests:
      cpu: 500m
      memory: 2Gi
    limits:
      # cpu: 1000m
      memory: 4Gi

# Configuration for ActiveGate instances
activeGate:
  # Specifies which capabilities will be enabled on ActiveGate instances
  capabilities:
    - routing
    - dynatrace-api

  # Resource settings for ActiveGate instances
  resources:
    requests:
      cpu: 500m
      memory: 2Gi
    limits:
      # cpu: 1000m
      memory: 4Gi

  replicas: 3

# Optional: Enables and controls log-monitoring
logMonitoring: {}
