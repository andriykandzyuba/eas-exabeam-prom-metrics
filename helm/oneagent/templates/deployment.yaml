{{- if .Values.secret.create }}
apiVersion: v1
data:
  apiToken: {{ .Values.secret.apiToken }}
  dataIngestToken: {{ .Values.secret.dataIngestToken }}
kind: Secret
metadata:
  name: {{ .Values.secret.name }}
  namespace: {{ include "oneagent.namespace" . }}
  labels:
    {{- include "oneagent.labels" . | nindent 4 }}
type: Opaque
{{- end }}
---
apiVersion: dynatrace.com/v1beta5
kind: DynaKube
metadata:
  name: {{ .Values.dynakubeK8sMonitoringName }}
  namespace: {{ include "oneagent.namespace" . }}
  labels:
    {{- include "oneagent.labels" . | nindent 4 }}
spec:
  apiUrl: {{ required "apiUrl is required" .Values.apiUrl }}
  tokens: {{ .Values.secret.name }}
  skipCertCheck: {{ .Values.skipCertCheck }}

  activeGate:
    capabilities:
      {{- toYaml .Values.activeGateK8sMonitoring.capabilities | nindent 6 }}
    resources:
      {{- toYaml .Values.activeGateK8sMonitoring.resources | nindent 6 }}
---
apiVersion: dynatrace.com/v1beta5
kind: DynaKube
metadata:
  name: {{ .Values.dynakubeName }}
  namespace: {{ include "oneagent.namespace" . }}
  labels:
    {{- include "oneagent.labels" . | nindent 4 }}
spec:
  apiUrl: {{ required "apiUrl is required" .Values.apiUrl }}
  tokens: {{ .Values.secret.name }}
  skipCertCheck: {{ .Values.skipCertCheck }}

  metadataEnrichment:
    enabled: {{ .Values.metadataEnrichment.enabled }}

  telemetryIngest:
    {{- toYaml .Values.telemetryIngest | nindent 4 }}
  templates:
    {{- toYaml .Values.templates | nindent 4 }}

  oneAgent:
    {{- if .Values.oneAgent.hostGroup }}
    hostGroup: {{ .Values.oneAgent.hostGroup | quote }}
    {{- end }}
    cloudNativeFullStack:
      {{- with .Values.oneAgent.cloudNativeFullStack }}
      {{- with .tolerations }}
      tolerations:
        {{- toYaml . | nindent 8 }}
      {{- end }}
      {{- with .resources }}
      oneAgentResources:
        {{- toYaml . | nindent 8 }}
      {{- end }}
      {{- end }}

  activeGate:
    capabilities:
      {{- toYaml .Values.activeGate.capabilities | nindent 6 }}
    resources:
      {{- toYaml .Values.activeGate.resources | nindent 6 }}
    replicas: {{ .Values.activeGate.replicas }}
