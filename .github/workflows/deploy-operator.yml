name: Deploy Dynatrace DynaKube Operator
on:
  workflow_dispatch:
    inputs:
      environment:
        description: 'Select the deployment environment'
        required: true
        type: choice
        options:
          - dev
          - prod
        default: dev

permissions:
  id-token: write
  contents: read

jobs:
  deploy-operator:
    runs-on: ubuntu-latest
    environment: ${{ inputs.environment }}
    env:
      GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
    steps:
      - name: 'Checkout repository'
        uses: actions/checkout@v4

      - name: 'Setup Kubeconfig'
        run: |
          mkdir -p $HOME/.kube
          echo "${{ secrets.KUBECONFIG_BASE64 }}" | base64 --decode > $HOME/.kube/config
          chmod 600 $HOME/.kube/config

      - name: 'Set up Helm'
        uses: azure/setup-helm@v4
        with:
          version: 'latest'

      - name: 'Create Dynatrace Namespace'
        run: |
          kubectl create namespace dynatrace --dry-run=client -o yaml | kubectl apply -f -

      - name: 'Deploy Dynatrace DynaKube Operator with Helm'
        run: |
          helm upgrade --install dynatrace-operator oci://public.ecr.aws/dynatrace/dynatrace-operator \
          --namespace dynatrace \
          --rollback-on-failure

      - name: 'Wait for Dynatrace DynaKube Operator Readiness'
        run: |
          kubectl rollout status deployment/dynatrace-operator -n dynatrace --timeout=300s