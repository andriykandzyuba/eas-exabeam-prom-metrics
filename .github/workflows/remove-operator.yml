name: Remove Dynatrace DynaKube Operator
on:
  workflow_dispatch:
    inputs:
      environment:
        description: 'Select the deployment environment'
        required: true
        type: choice
        options:
          - dev
          - prod
        default: dev

permissions:
  id-token: write
  contents: read

jobs:
  remove-operator:
    runs-on: ubuntu-latest
    environment: ${{ inputs.environment }}
    env:
      GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
    steps:
      - name: 'Checkout repository'
        uses: actions/checkout@v4

      - name: 'Setup Kubeconfig'
        run: |
          mkdir -p $HOME/.kube
          echo "${{ secrets.KUBECONFIG_BASE64 }}" | base64 --decode > $HOME/.kube/config
          chmod 600 $HOME/.kube/config

      - name: 'Set up Helm'
        uses: azure/setup-helm@v4
        with:
          version: 'latest'

      - name: 'Uninstall Dynatrace DynaKube Operator with Helm'
        run: |
          helm uninstall dynatrace-operator \
          --namespace dynatrace \
          --ignore-not-found

      - name: 'Delete Dynatrace Namespace'
        run: |
          kubectl get namespace dynatrace -o json | jq '.spec.finalizers = []' | kubectl replace --raw "/api/v1/namespaces/dynatrace/finalize" -f -          
          kubectl delete namespace dynatrace --ignore-not-found