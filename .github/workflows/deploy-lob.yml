name: Deploy Lob App to K8s

on:
  workflow_dispatch:
    inputs:
      environment:
        description: 'Select the deployment environment'
        required: true
        type: choice
        options:
          - dev
          - stage
          - prod
        default: dev
      app:
        description: 'Select the application to deploy'
        required: true
        type: choice
        options:
          - python
          - go
        default: python
      sha:
        description: 'Image Tag'
        required: true

# Required if using OIDC for authentication in 2026
permissions:
  id-token: write
  contents: read

jobs:
  deploy-lob:
    runs-on: ubuntu-latest
    environment: ${{ inputs.environment }}
    env:
      GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
    steps:
      - name: 'Print Context Info'
        run: |
          echo "Environment Name: ${{ env.DEPLOY_ENV }}"
          echo "Apps Namespace Prefix: ${{ vars.K8S_NS_APPS_PREFIX }}"

      - name: 'Checkout repository'
        uses: actions/checkout@v4

      - name: 'Setup Kubeconfig'
        run: |
          mkdir -p $HOME/.kube
          echo "${{ secrets.KUBECONFIG_BASE64 }}" | base64 --decode > $HOME/.kube/config
          chmod 600 $HOME/.kube/config

      - name: 'Set up Helm'
        uses: azure/setup-helm@v4 # Use a GitHub action to install Helm CLI
        with:
          version: 'latest' # Installs the latest Helm version

      - name: 'Deploy LOB application with Helm'
        run: |
          helm install ${{ vars.HELM_LOB_REPO }} helm/probs/lob \
          --set environment=${{ inputs.environment }} \
          --set app=${{ inputs.app }} \
          --set namespace.name=${{ vars.K8S_NS_APPS_PREFIX }}-${{ inputs.environment }}-${{ inputs.app }} \
          --set secretName=${{ vars.REGISTRY_SECRET_NAME }} \
          --set containerRegistry.registry=${{ vars.REGISTRY_LOGIN_SERVER }} \
          --set containerRegistry.username=${{ secrets.REGISTRY_USERNAME }} \
          --set containerRegistry.password=${{ secrets.REGISTRY_PASSWORD }} \
          --set containerRegistry.email=${{ vars.REGISTRY_EMAIL }} \
          --set image.repository=${{ vars.REGISTRY_LOGIN_SERVER }} \
          --set image.name=${{ github.repository }}-${{ inputs.app }} \
          --set image.tag=${{ inputs.sha }} \
          --set podLabels."instrumentation\.opentelemetry\.io/inject-${{ inputs.app }}"="true" \
          --namespace ${{ vars.K8S_NS_APPS_PREFIX }}-${{ inputs.environment }}-${{ inputs.app }} \
          --create-namespace