name: Deploy Dynatrace Log Monitoring to K8s

on:
  workflow_dispatch:
    inputs:
      environment:
        description: 'Select the deployment environment'
        required: true
        type: choice
        options:
          - dev
          - prod
        default: prod

# Required if using OIDC for authentication in 2026
permissions:
  id-token: write
  contents: read

jobs:
  deploy-dynakube:
    runs-on: ubuntu-latest
    environment: ${{ inputs.environment }}
    env:
      GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
    steps:
      - name: 'Print Context Info'
        run: |
          echo "Environment Name: ${{ inputs.environment }}"

      - name: 'Checkout repository'
        uses: actions/checkout@v4

      - name: 'Setup Kubeconfig'
        run: |
          mkdir -p $HOME/.kube
          echo "${{ secrets.KUBECONFIG_BASE64 }}" | base64 --decode > $HOME/.kube/config
          chmod 600 $HOME/.kube/config

      - name: 'Set up Helm'
        uses: azure/setup-helm@v4 # Use a GitHub action to install Helm CLI
        with:
          version: 'latest' # Installs the latest Helm version

      - name: 'Encode Dynatrace API Token and Data Ingest Token as Base64 and Set as Environment Variables'
        run: |
          echo "DT_DYNAKUBE_API_TOKEN_BASE64=$( echo -n "${{ secrets.DT_DYNAKUBE_API_TOKEN }}" | base64 -w 0 )" >> $GITHUB_ENV
          echo "DT_DYNAKUBE_DATA_INGEST_TOKEN_BASE64=$( echo -n "${{ secrets.DT_DYNAKUBE_DATA_INGEST_TOKEN }}" | base64 -w 0 )" >> $GITHUB_ENV

      - name: 'Deploy DynaKube Log Monitoring with Helm'
        run: |
          helm upgrade --install dynatrace-log-monitoring helm/logMonitor \
          --set apiUrl=https://${{ vars.DT_ENVIRONMENT_ID }}.live.dynatrace.com/api \
          --set secret.apiToken=$DT_DYNAKUBE_API_TOKEN_BASE64 \
          --set secret.dataIngestToken=$DT_DYNAKUBE_DATA_INGEST_TOKEN_BASE64 \
          --set templates.logMonitoring.imageRef.repository=public.ecr.aws/dynatrace/dynatrace-logmodule \
          --set templates.logMonitoring.imageRef.tag=1.341.80.20260805-102532-fips \
          --namespace dynatrace \
          --rollback-on-failure \
          --force-replace